name: Cipher Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run watchdog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTEGRITY_URL: https://xynote.de/api/integrity
          HOME_URL: https://xynote.de/
          EXPECTED_FINGERPRINT: SHA256:Cjz/qrgq22L96iU6HlJq28ePXhz9PGIGveMcHnganDs
        run: python3 watchdog.py
